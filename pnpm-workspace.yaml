minimumReleaseAgeExclude:
  - '@favorodera/eslint-config@1.0.0'
shellEmulator: true

trustPolicy: no-downgrade

allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  better-sqlite3: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  vue-demi: true

catalogs:
  dev:
    '@favorodera/eslint-config': ^1.0.0
    '@types/node': ^25.6.2
    '@typescript/native-preview': 7.0.0-dev.20260509.2
    '@vitest/ui': 4.1.8
    db0: ^0.3.4

    eslint: ^10.4.1
    relizy: ^1.4.9
    tsdown: ^0.22.0
    typescript: ^7.0.0
    vitest: ^4.1.5
  vendor:
    zod: ^4.4.3

peerDependencyRules:
  allowedVersions:
    typescript: '6'
    vite: '8'
