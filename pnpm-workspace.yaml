shellEmulator: true

trustPolicy: no-downgrade

# eslint-disable-next-line pnpm/yaml-enforce-settings
allowBuilds:
  '@parcel/watcher': true
  esbuild: true

catalog:
  '@favorodera/eslint-config': ^1.2.0
  '@types/node': ^26.2.0
  '@vitest/ui': 4.1.11
  db0: ^0.4.0
  eslint: ^10.8.1
  relizy: ^1.4.9
  tsdown: ^0.23.0
  typescript: ^6.0.3
  vitest: ^4.1.10
  zod: ^4.4.3

peerDependencyRules:
  allowedVersions:
    typescript: '6'
    vite: '8'
